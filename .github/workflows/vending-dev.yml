name: Vending Dev

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: Deploy Vending Dev
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: vending/dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Azure configuration
        run: |
          echo "Client ID configured: ${{ vars.AZURE_CLIENT_ID != '' }}"
          echo "Tenant ID configured: ${{ vars.AZURE_TENANT_ID != '' }}"
          echo "Subscription ID configured: ${{ vars.AZURE_SUBSCRIPTION_ID != '' }}"

      - name: Login to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan