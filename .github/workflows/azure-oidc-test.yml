name: Azure OIDC Authentication Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-azure-login:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect GitHub OIDC claims
        shell: bash
        run: |
          TOKEN_JSON=$(curl -sSf \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange")

          TOKEN=$(echo "$TOKEN_JSON" | jq -r '.value')

          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f2)
          PAYLOAD="${PAYLOAD//-/+}"
          PAYLOAD="${PAYLOAD//_/\/}"

          case $((${#PAYLOAD} % 4)) in
            2) PAYLOAD="${PAYLOAD}==" ;;
            3) PAYLOAD="${PAYLOAD}=" ;;
          esac

          echo "$PAYLOAD" | base64 -d | jq '{
            iss,
            sub,
            aud,
            repository,
            repository_id,
            repository_owner,
            repository_owner_id,
            environment,
            ref
          }'

      - name: Login to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure identity
        run: |
          echo "OIDC authentication succeeded."
          az account show \
            --query "{subscription:name, tenant:tenantId, user:user.name}" \
            --output table

      - name: Test access to shared resource group
        run: |
          az group show \
            --name rg-leke-shared-uks-dev \
            --query "{name:name, location:location}" \
            --output table

      - name: Test access to data platform resource group
        run: |
          az group show \
            --name rg-leke-dataplatform-uks-dev \
            --query "{name:name, location:location}" \
            --output table