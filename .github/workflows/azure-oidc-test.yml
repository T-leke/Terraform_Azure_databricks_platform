name: Azure OIDC Authentication Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-azure-login:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Login to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure identity
        run: |
          echo "OIDC authentication succeeded."
          az account show \
            --query "{subscription:name, tenant:tenantId, user:user.name}" \
            --output table

      - name: Test access to shared resource group
        run: |
          az group show \
            --name rg-leke-shared-uks-dev \
            --query "{name:name, location:location}" \
            --output table

      - name: Test access to data platform resource group
        run: |
          az group show \
            --name rg-leke-dataplatform-uks-dev \
            --query "{name:name, location:location}" \
            --output table